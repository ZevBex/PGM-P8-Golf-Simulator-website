name: Deploy static website to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          shopt -s nullglob
          cp -- *.html *.css *.js *.xml robots.txt indexnow-key.txt CNAME .nojekyll _site/
          for directory in assets partners products solutions guides case-studies about support; do
            if [ -d "$directory" ]; then
              cp -R -- "$directory" _site/
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
